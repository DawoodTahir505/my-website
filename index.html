<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawood | Data Scientist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- HERO SECTION -->
    <header class="hero">
        <div class="container">
            <span class="status-badge">Available for Roles</span>
            <h1>Hi, I'm <span class="highlight">Dawood</span>.</h1>
            <p class="subtitle">Data Scientist specializing in predictive modeling, exploratory analysis, and automated machine learning deployments.</p>
            <div class="social-links">
                <a href="#" target="_blank" class="btn btn-outline"><i class="fab fa-github"></i> GitHub</a>
                <a href="#" target="_blank" class="btn btn-outline"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="#" download class="btn btn-primary"><i class="fas fa-file-download"></i> View CV</a>
            </div>
        </div>
    </header>

    <!-- SKILLS SECTION -->
    <section class="skills-section container">
        <h2 class="section-title">Technical Expertise</h2>
        <div class="skills-grid">

            <!-- PYTHON -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python" class="skill-icon isometric-3d">
                </div>
                <h3>Python</h3>
            </div>

            <!-- FASTAPI -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/fastapi/fastapi-original.svg" alt="FastAPI" class="skill-icon isometric-3d">
                </div>
                <h3>FastAPI</h3>
            </div>

            <!-- STREAMLIT -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <img src="https://streamlit.io/images/brand/streamlit-mark-color.svg" alt="Streamlit" class="skill-icon isometric-3d">
                </div>
                <h3>Streamlit</h3>
            </div>

            <!-- DEEP LEARNING -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tensorflow/tensorflow-original.svg" alt="Deep Learning" class="skill-icon isometric-3d">
                </div>
                <h3>Deep Learning</h3>
            </div>

            <!-- NLP -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <i class="fas fa-brain fa-3x fallback-icon"></i>
                </div>
                <h3>NLP</h3>
            </div>

            <!-- NUMPY -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/numpy/numpy-original.svg" alt="NumPy" class="skill-icon isometric-3d">
                </div>
                <h3>NumPy</h3>
            </div>

            <!-- PANDAS -->
            <div class="skill-card">
                <div class="icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/pandas/pandas-original.svg" alt="Pandas" class="skill-icon isometric-3d">
                </div>
                <h3>Pandas</h3>
            </div>

        </div>
    </section>

</body>
</html>
