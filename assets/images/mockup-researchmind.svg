    <text x="285" y="265">def compile_structured_summary(chunks: List[Document]):</text>
    <text x="305" y="285">chain = prompt | llm.bind(response_format={"type": "json"})</text>
    <text x="305" y="305">return chain.invoke({"sources": chunks, "citations": True})</text>
